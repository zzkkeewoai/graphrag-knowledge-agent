# CI：只跑不依赖外部服务的静态检查
#
# 为什么不跑完整评测：
#   完整评测需要 Neo4j + 向量库 + LLM API——CI 里既没有服务、也不该烧 API 额度
#   （105 道题一次几毛钱，每次提交都跑不合适）。
#   所以评测分两层：
#     · 这一层（秒级、免费）：schema / 数据集格式 / 判分器 / 切段 / prompt 完整性
#     · 完整评测（本地手动）：python tests/run_all.py
#
# 这层的价值：schema 被改坏、判分器写错、数据集格式崩了——这些都能在提交时拦住，
# 而它们恰恰是最容易在改动中悄悄坏掉的部分。

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装静态检查所需的最小依赖
        run: |
          python -m pip install --upgrade pip
          # 故意不装 torch / sentence-transformers / pymilvus：
          # 这一层不碰向量库与 embedding 模型，装上只会让 CI 慢几十倍
          pip install pydantic python-dotenv openai neo4j tiktoken

      - name: 静态检查
        run: python tests/test_static.py

      - name: 证据验证器单测
        run: python tests/test_evidence_validator.py
