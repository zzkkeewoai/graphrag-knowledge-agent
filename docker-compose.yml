version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community  # 稳定的LTS版本
    container_name: graphrag_neo4j
    ports:
      - "7474:7474"   # HTTP Web界面端口
      - "7687:7687"   # Bolt协议端口（Python连接用这个）
    environment:
      - NEO4J_AUTH=neo4j/password123  # 用户名/密码（后面代码要用）
      - NEO4J_PLUGINS='["apoc"]'       # 加载APOC插件（增强图算法）
    volumes:
      - ./neo4j_data:/data            # 持久化存储（重启不丢数据）
      - ./neo4j_logs:/logs            # 日志
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: graphrag_milvus
    ports:
      - "19530:19530"   # gRPC端口（Python连接用）
      - "9091:9091"     # 监控端口
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    command: milvus run standalone
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: graphrag_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./etcd_data:/etcd_data
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd_data

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: graphrag_minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3